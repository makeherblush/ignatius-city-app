<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crestville - Web Life Simulator</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            950: '#090d16'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Scrollbar untuk Tampilan HP */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans selection:bg-sky-500 selection:text-white p-0 sm:p-4">

    <!-- AUDIO ELEMENTS -->
    <audio id="bg-audio" loop>
        <source src="backsound.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-cash" preload="auto">
        <source src="cash-register.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-siren" preload="auto">
        <source src="siren-911.mp3" type="audio/mpeg">
    </audio>

    <!-- BINGKAI HP / IPHONE WRAPPER -->
    <div class="w-full sm:max-w-[420px] h-screen sm:h-[860px] bg-slate-950 sm:rounded-[40px] sm:border-[8px] sm:border-slate-800 shadow-2xl flex flex-col overflow-hidden relative">

        <!-- HEADER & STATUS BAR -->
        <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-950/90 border-b border-slate-800/80 px-4 py-3 shrink-0">
            <div class="flex items-center justify-between gap-2">
                
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/20 overflow-hidden border border-sky-500/30 shrink-0">
                        <img src="logo.png" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="hidden items-center justify-center w-full h-full"><i class="fa-solid fa-city text-sm"></i></div>
                    </div>
                    <div>
                        <h1 class="font-bold text-xs text-slate-100 tracking-wide uppercase">Crestville</h1>
                        <span class="text-[9px] text-sky-400 font-mono">Simulator v1.0</span>
                    </div>
                </div>

                <div class="flex items-center gap-1.5">
                    <button onclick="toggleBacksound()" id="audio-toggle-btn" class="p-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs text-slate-300 flex items-center justify-center transition-all" title="Toggle Audio">
                        <i id="audio-icon" class="fa-solid fa-volume-xmark text-rose-400 text-xs"></i>
                    </button>

                    <div class="px-2.5 py-1.5 bg-slate-900 border border-slate-800 rounded-xl flex items-center gap-1.5">
                        <i class="fa-solid fa-coins text-amber-400 text-xs"></i>
                        <span class="global-crest-display text-[11px] font-mono font-bold text-amber-400">0</span>
                    </div>
                </div>

            </div>

            <!-- Vitality Bar Minimalis -->
            <div class="mt-2.5 px-3 py-1.5 bg-slate-900/80 border border-slate-800/80 rounded-xl flex items-center gap-2">
                <i class="fa-solid fa-heart-pulse text-rose-500 text-xs"></i>
                <div class="flex-1 space-y-1">
                    <div class="flex justify-between text-[9px] font-mono">
                        <span class="text-slate-400">Vitality</span>
                        <span class="global-vitality-text text-rose-400 font-bold">100 / 100</span>
                    </div>
                    <div class="w-full h-1 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                        <div class="global-vitality-bar h-full bg-gradient-to-r from-rose-600 to-amber-500 transition-all duration-300" style="width: 100%"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- KONTEN UTAMA (SCROLLABLE DALAM HP) -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4">

            <!-- Navigasi Menu Tab -->
            <nav class="grid grid-cols-4 gap-1.5 bg-slate-900/50 p-1.5 rounded-2xl border border-slate-800/80">
                <button id="nav-citymap" onclick="switchTab('citymap')" class="nav-tab-btn px-2 py-2 rounded-xl text-[10px] font-bold transition-all flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-map-location-dot text-sm"></i> Peta
                </button>
                <button id="nav-jobs" onclick="switchTab('jobs')" class="nav-tab-btn px-2 py-2 rounded-xl text-[10px] font-bold transition-all flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-briefcase text-sm"></i> Kerja
                </button>
                <button id="nav-admin" onclick="switchTab('admin')" class="nav-tab-btn px-2 py-2 rounded-xl text-[10px] font-bold transition-all flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-address-card text-sm"></i> KTP
                </button>
                <button id="nav-property" onclick="switchTab('property')" class="nav-tab-btn px-2 py-2 rounded-xl text-[10px] font-bold transition-all flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-house-chimney text-sm"></i> Rumah
                </button>
            </nav>

            <!-- Container Konten Tiap Tab -->
            <div class="space-y-4 pb-6">
                <div id="citymap-tab" class="game-tab-content space-y-4"></div>
                <div id="jobs-tab" class="game-tab-content space-y-4 hidden"></div>
                <div id="admin-tab" class="game-tab-content space-y-4 hidden"></div>
                <div id="property-tab" class="game-tab-content space-y-4 hidden"></div>
            </div>

        </main>

        <!-- Footer / Home Indicator ala iPhone -->
        <footer class="shrink-0 py-2 bg-slate-950 flex justify-center items-center border-t border-slate-900">
            <div class="w-32 h-1 bg-slate-700 rounded-full opacity-60"></div>
        </footer>

    </div>

    <script>
        function toggleBacksound() {
            const bgAudio = document.getElementById('bg-audio');
            const icon = document.getElementById('audio-icon');
            if (bgAudio.paused) {
                bgAudio.volume = 0.4;
                bgAudio.play().then(() => {
                    icon.className = 'fa-solid fa-volume-high text-emerald-400 text-xs';
                }).catch(e => console.log("Audio play blocked:", e));
            } else {
                bgAudio.pause();
                icon.className = 'fa-solid fa-volume-xmark text-rose-400 text-xs';
            }
        }
    </script>

    <!-- SCRIPT JAVASCRIPT UTAMA -->
    <script src="state.js"></script>
    <script src="utils/formatters.js"></script>
    <script src="modules/admin.js"></script>
    <script src="modules/jobs.js"></script>
    <script src="modules/property.js"></script>
    <script src="modules/cityMap.js"></script>
    <script src="storage.js"></script>
    <script src="main.js"></script>

</body>
</html>
