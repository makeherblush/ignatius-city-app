<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crestville - Web Life Simulator</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0f172a',
                            950: '#090d16'
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-sky-500 selection:text-white">

    <!-- AUDIO ELEMENTS -->
    <audio id="bg-audio" loop>
        <source src="backsound.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-cash" preload="auto">
        <source src="cash-register.mp3" type="audio/mpeg">
    </audio>
    <audio id="sfx-siren" preload="auto">
        <source src="siren-911.mp3" type="audio/mpeg">
    </audio>

    <!-- HEADER & STATUS BAR GLOBAL -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-slate-950/80 border-b border-slate-800/80 px-4 py-3">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-sky-500/20 overflow-hidden border border-sky-500/30">
                    <img src="logo.png" alt="Logo" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div class="hidden items-center justify-center w-full h-full"><i class="fa-solid fa-city text-lg"></i></div>
                </div>
                <div>
                    <h1 class="font-bold text-sm text-slate-100 tracking-wide uppercase">Crestville</h1>
                    <span class="text-[10px] text-sky-400 font-mono">Web Life Simulator v1.0</span>
                </div>
            </div>

            <div class="flex items-center flex-wrap gap-3">
                <button onclick="toggleBacksound()" id="audio-toggle-btn" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold text-slate-300 flex items-center gap-2 transition-all">
                    <i id="audio-icon" class="fa-solid fa-volume-xmark text-rose-400"></i>
                    <span id="audio-text" class="hidden sm:inline">Musik: Mati</span>
                </button>

                <div class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl flex items-center gap-2">
                    <i class="fa-solid fa-coins text-amber-400 text-xs"></i>
                    <span class="global-crest-display text-xs font-mono font-bold text-amber-400">0 Crest</span>
                </div>

                <div class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl flex items-center gap-3 min-w-[150px]">
                    <i class="fa-solid fa-heart-pulse text-rose-500 text-xs"></i>
                    <div class="flex-1 space-y-1">
                        <div class="flex justify-between text-[10px] font-mono">
                            <span class="text-slate-400">Vitality</span>
                            <span class="global-vitality-text text-rose-400 font-bold">100 / 100 Vit</span>
                        </div>
                        <div class="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden border border-slate-800">
                            <div class="global-vitality-bar h-full bg-gradient-to-r from-rose-600 to-amber-500 transition-all duration-300" style="width: 100%"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 space-y-6">

        <nav class="flex flex-wrap gap-2 border-b border-slate-800/60 pb-4">
            <button id="nav-citymap" onclick="switchTab('citymap')" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                <i class="fa-solid fa-map-location-dot"></i> Peta Kota
            </button>
            <button id="nav-jobs" onclick="switchTab('jobs')" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                <i class="fa-solid fa-briefcase"></i> Bursa Kerja
            </button>
            <button id="nav-admin" onclick="switchTab('admin')" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                <i class="fa-solid fa-address-card"></i> KTP & Lisensi
            </button>
            <button id="nav-property" onclick="switchTab('property')" class="nav-tab-btn px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                <i class="fa-solid fa-house-chimney"></i> Properti & Hunian
            </button>
        </nav>

        <div class="space-y-4">
            <div id="citymap-tab" class="game-tab-content space-y-4"></div>
            <div id="jobs-tab" class="game-tab-content space-y-4 hidden"></div>
            <div id="admin-tab" class="game-tab-content space-y-4 hidden"></div>
            <div id="property-tab" class="game-tab-content space-y-4 hidden"></div>
        </div>

    </main>

    <footer class="mt-auto border-t border-slate-900 bg-slate-950 py-4 text-center text-[11px] text-slate-500 font-mono">
        <p>&copy; 2026 Kota Crestville • All Rights Reserved.</p>
    </footer>

    <script>
        function toggleBacksound() {
            const bgAudio = document.getElementById('bg-audio');
            const icon = document.getElementById('audio-icon');
            const text = document.getElementById('audio-text');
            if (bgAudio.paused) {
                bgAudio.volume = 0.4;
                bgAudio.play().then(() => {
                    icon.className = 'fa-solid fa-volume-high text-emerald-400';
                    text.textContent = 'Musik: Nyala';
                });
            } else {
                bgAudio.pause();
                icon.className = 'fa-solid fa-volume-xmark text-rose-400';
                text.textContent = 'Musik: Mati';
            }
        }
    </script>

    <!-- SCRIPT JS LANGSUNG ROOT -->
    <script src="state.js"></script>
    <script src="utils/formatters.js"></script>
    <script src="modules/admin.js"></script>
    <script src="modules/jobs.js"></script>
    <script src="modules/property.js"></script>
    <script src="modules/cityMap.js"></script>
    <script src="storage.js"></script>
    <script src="main.js"></script>

</body>
</html>
