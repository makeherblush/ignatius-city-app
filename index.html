<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kota Ignatius - iOS Life Simulator</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="assets/css/ios-style.css">

<style id="ios-latest-ui-upgrade">
/* =========================================================
   iOS-inspired visual upgrade — UI ONLY
   Existing functionality / IDs / JS hooks intentionally untouched.
   ========================================================= */
:root{
  --ios-font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
    "Helvetica Neue",Helvetica,Arial,sans-serif;
  --ios-radius-xl:24px;
  --ios-radius-lg:20px;
  --ios-radius-md:16px;
  --ios-ease:cubic-bezier(.22,.61,.36,1);
}

html,body{
  font-family:var(--ios-font)!important;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

body{
  background:#000!important;
  letter-spacing:-.01em;
}

/* Device */
#iphone-chassis{
  width:100%!important;
  max-width:402px!important;
  height:100dvh!important;
  max-height:874px!important;
  border-radius:46px!important;
  border:8px solid #151515!important;
  background:#000!important;
  box-shadow:
    0 34px 90px rgba(0,0,0,.62),
    0 0 0 1px rgba(255,255,255,.07),
    inset 0 0 0 1px rgba(255,255,255,.05)!important;
  isolation:isolate;
}

@media (max-width:640px){
  #iphone-chassis{
    max-width:none!important;
    height:100dvh!important;
    max-height:none!important;
    border:0!important;
    border-radius:0!important;
  }
}

/* Safe-area/status treatment */
#iphone-chassis > .absolute.top-0{
  padding-top:max(12px, env(safe-area-inset-top))!important;
  padding-left:22px!important;
  padding-right:22px!important;
  height:54px;
  align-items:flex-start!important;
}

#ios-clock-status{
  font-family:var(--ios-font)!important;
  font-size:14px!important;
  line-height:18px!important;
  font-weight:650!important;
  letter-spacing:-.01em!important;
}

#iphone-chassis .text-xs,
#iphone-chassis .text-\[10px\],
#iphone-chassis .text-\[11px\],
#iphone-chassis .text-\[9px\]{
  letter-spacing:-.005em;
}

/* Dynamic Island */
#iphone-chassis > .absolute.top-0 > div:nth-child(2){
  width:126px!important;
  height:30px!important;
  border-radius:999px!important;
  border:0!important;
  box-shadow:0 2px 8px rgba(0,0,0,.5)!important;
}

/* Screen geometry */
#iphone-chassis > .flex-1{
  padding-top:0!important;
  padding-bottom:0!important;
}

#screen-register,
#screen-lockscreen,
#screen-passcode,
#screen-homescreen,
#screen-app-window{
  font-family:var(--ios-font)!important;
  -webkit-tap-highlight-color:transparent;
}

/* Glass surfaces */
.glass-ios,
.glass-card{
  background:rgba(28,28,30,.62)!important;
  border-color:rgba(255,255,255,.12)!important;
  box-shadow:
    0 10px 30px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.08)!important;
  backdrop-filter:blur(28px) saturate(155%)!important;
  -webkit-backdrop-filter:blur(28px) saturate(155%)!important;
}

.glass-ios{
  border-radius:22px!important;
}

/* Typography */
h1,h2,h3,h4,p,span,button,input,select,label{
  font-family:var(--ios-font)!important;
}

h1,h2,h3,h4{
  letter-spacing:-.025em!important;
}

button,input,select{
  font-size:inherit;
}

/* Lock screen */
#screen-lockscreen{
  padding:0 20px!important;
  padding-top:max(74px,calc(env(safe-area-inset-top) + 58px))!important;
  padding-bottom:max(24px,env(safe-area-inset-bottom))!important;
}

#ios-date-display{
  font-size:17px!important;
  line-height:22px!important;
  font-weight:600!important;
  text-transform:none!important;
  letter-spacing:-.02em!important;
  color:rgba(255,255,255,.92)!important;
}

#ios-clock-big{
  font-size:76px!important;
  line-height:.98!important;
  font-weight:300!important;
  letter-spacing:-.055em!important;
}

#screen-lockscreen .glass-ios{
  border-radius:22px!important;
  padding:14px!important;
}

#screen-lockscreen .animate-bounce{
  animation-duration:1.8s!important;
}

/* Passcode */
#screen-passcode{
  padding:0 26px!important;
  padding-top:max(76px,calc(env(safe-area-inset-top) + 58px))!important;
  padding-bottom:max(28px,env(safe-area-inset-bottom))!important;
}

#screen-passcode h3{
  font-size:17px!important;
  font-weight:600!important;
}

#passcode-dots > div{
  width:9px!important;
  height:9px!important;
  border-width:1.5px!important;
}

#screen-passcode .grid{
  max-width:286px!important;
  gap:12px 10px!important;
  margin-bottom:20px!important;
}

#screen-passcode .keypad-btn{
  width:72px!important;
  height:72px!important;
  border-radius:50%!important;
  background:rgba(255,255,255,.13)!important;
  border:1px solid rgba(255,255,255,.08)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06)!important;
  font-size:25px!important;
  font-weight:400!important;
  transition:transform .14s var(--ios-ease),background .14s ease!important;
}

#screen-passcode .keypad-btn:active{
  transform:scale(.91)!important;
  background:rgba(255,255,255,.24)!important;
}

#screen-passcode .grid > button:nth-last-child(3),
#screen-passcode .grid > button:last-child{
  width:72px!important;
  height:72px!important;
}

/* Home screen */
#screen-homescreen{
  padding:0 17px!important;
  padding-top:max(62px,calc(env(safe-area-inset-top) + 45px))!important;
  padding-bottom:max(17px,env(safe-area-inset-bottom))!important;
}

#screen-homescreen > div:first-child{
  padding-top:0!important;
  gap:18px!important;
}

#screen-homescreen .glass-ios:first-child{
  padding:12px!important;
  border-radius:22px!important;
}

#home-user-avatar{
  width:38px!important;
  height:38px!important;
}

#home-user-name{
  font-size:14px!important;
  line-height:17px!important;
  font-weight:650!important;
}

#home-user-nik{
  font-size:10px!important;
}

#homescreen-app-grid{
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
  gap:18px 12px!important;
  padding:0 3px!important;
}

#homescreen-app-grid .app-icon{
  min-width:0;
}

/* Make generated app icons visually iOS-like without changing their JS data */
#homescreen-app-grid .app-icon > div{
  width:56px!important;
  height:56px!important;
  margin:auto!important;
  border-radius:15px!important;
  box-shadow:
    0 7px 14px rgba(0,0,0,.26),
    inset 0 1px 0 rgba(255,255,255,.18)!important;
  position:relative;
  overflow:hidden;
  transition:transform .16s var(--ios-ease),filter .16s ease!important;
}

#homescreen-app-grid .app-icon > div::after,
#screen-homescreen .app-icon > div::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 42%);
  pointer-events:none;
}

#homescreen-app-grid .app-icon:active > div,
#screen-homescreen .app-icon:active > div{
  transform:scale(.9)!important;
  filter:brightness(.86)!important;
}

#homescreen-app-grid .app-icon i{
  font-size:23px!important;
  position:relative;
  z-index:1;
}

#homescreen-app-grid .app-icon span{
  display:block;
  margin-top:6px!important;
  font-size:11px!important;
  line-height:14px!important;
  font-weight:500!important;
  text-shadow:0 1px 4px rgba(0,0,0,.7)!important;
}

/* Dock */
#screen-homescreen > div:last-child{
  padding:10px!important;
  border-radius:27px!important;
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
  gap:8px!important;
  margin-bottom:1px!important;
  background:rgba(245,245,247,.20)!important;
  border-color:rgba(255,255,255,.18)!important;
}

#screen-homescreen > div:last-child .app-icon > div{
  width:56px!important;
  height:56px!important;
  border-radius:15px!important;
  box-shadow:0 6px 13px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16)!important;
  transition:transform .16s var(--ios-ease)!important;
}

#screen-homescreen > div:last-child .app-icon:active > div{
  transform:scale(.9)!important;
}

#screen-homescreen > div:last-child i{
  font-size:22px!important;
}

/* App window */
#screen-app-window{
  padding-top:max(46px,calc(env(safe-area-inset-top) + 30px))!important;
  background:#000!important;
}

#screen-app-window > div:first-child{
  min-height:56px!important;
  padding:8px 17px!important;
  background:rgba(28,28,30,.82)!important;
  backdrop-filter:blur(24px) saturate(150%)!important;
  -webkit-backdrop-filter:blur(24px) saturate(150%)!important;
  border-bottom:1px solid rgba(255,255,255,.1)!important;
}

#app-window-title{
  font-size:15px!important;
  font-weight:650!important;
  letter-spacing:-.015em!important;
  text-transform:none!important;
}

#screen-app-window > div:first-child button{
  font-size:15px!important;
  font-weight:500!important;
}

#app-window-body{
  padding:18px!important;
  gap:14px!important;
}

/* Home indicator */
#iphone-chassis > .absolute.bottom-1{
  bottom:max(5px,env(safe-area-inset-bottom))!important;
  padding:5px 0!important;
}

#iphone-chassis > .absolute.bottom-1 > div{
  width:134px!important;
  height:5px!important;
  background:rgba(255,255,255,.82)!important;
  border-radius:999px!important;
}

/* Inputs/buttons feel native */
#screen-register input,
#screen-register select{
  min-height:48px!important;
  border-radius:14px!important;
  background:rgba(28,28,30,.9)!important;
  font-size:16px!important;
  font-weight:400!important;
}

#screen-register button[type="submit"]{
  min-height:50px!important;
  border-radius:16px!important;
  font-size:15px!important;
  font-weight:600!important;
  box-shadow:0 7px 20px rgba(0,122,255,.22)!important;
}

#toast-ios{
  top:max(56px,calc(env(safe-area-inset-top) + 42px))!important;
}

#toast-ios-box{
  border-radius:18px!important;
  padding:12px 14px!important;
  background:rgba(35,35,38,.78)!important;
  backdrop-filter:blur(24px) saturate(150%)!important;
  -webkit-backdrop-filter:blur(24px) saturate(150%)!important;
}

/* Remove visual dead space created by Tailwind's generic spacing on key screens */
#screen-register > div:first-child{
  max-width:100%!important;
}

@media (max-height:760px){
  #homescreen-app-grid{
    gap:12px 10px!important;
  }
  #homescreen-app-grid .app-icon > div,
  #screen-homescreen > div:last-child .app-icon > div{
    width:52px!important;
    height:52px!important;
  }
}
</style>

</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4 font-ios overflow-hidden select-none">

    <!-- AUDIO ELEMENTS -->
    <audio id="audio-lock" src="assets/audio/lock.mp3" preload="auto"></audio>
    <audio id="audio-unlock" src="assets/audio/unlock.mp3" preload="auto"></audio>
    <audio id="audio-keypad" src="assets/audio/keypad.mp3" preload="auto"></audio>
    <audio id="audio-cash" src="assets/audio/cash.mp3" preload="auto"></audio>
    <audio id="audio-siren" src="assets/audio/siren.mp3" preload="auto"></audio>
    <audio id="audio-error" src="assets/audio/error.mp3" preload="auto"></audio>
    <audio id="audio-noti" src="assets/audio/notification.mp3" preload="auto"></audio>

    <!-- IPHONE CHASSIS -->
    <div id="iphone-chassis" class="w-full sm:max-w-[390px] h-screen sm:h-[844px] bg-black sm:rounded-[50px] sm:border-[10px] sm:border-slate-800 shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- STATUS BAR iOS & DYNAMIC ISLAND -->
        <div class="absolute top-0 left-0 right-0 z-50 px-6 pt-3 pb-2 flex justify-between items-center text-white text-xs font-semibold pointer-events-none bg-gradient-to-b from-black/60 to-transparent">
            <span id="ios-clock-status">12:00</span>
            
            <div class="w-28 h-7 bg-black rounded-full flex items-center justify-between px-2.5 border border-white/10 shadow-md pointer-events-auto">
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/80 animate-pulse"></div>
                <span class="text-[9px] text-slate-400 font-mono">IGNATIUS OS</span>
                <i class="fa-solid fa-lock text-[9px] text-amber-400" id="island-lock-icon"></i>
            </div>

            <div class="flex items-center gap-1.5 text-[11px]">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-three-quarters text-emerald-400"></i>
            </div>
        </div>

        <!-- TOAST NOTIFICATION INSIDE PHONE SCREEN -->
        <div id="toast-ios" class="absolute top-12 left-1/2 -translate-x-1/2 z-[60] w-[88%] pointer-events-none transition-all duration-300 opacity-0 -translate-y-4">
            <div id="toast-ios-box" class="glass-ios p-3 rounded-2xl flex items-center gap-3 text-xs font-medium text-white shadow-2xl border border-white/20">
                <i id="toast-ios-icon" class="fa-solid fa-circle-info text-sky-400 text-base shrink-0"></i>
                <span id="toast-ios-msg" class="leading-tight">Pesan Notifikasi</span>
            </div>
        </div>

        <!-- SCREEN CONTAINER -->
        <div class="flex-1 w-full h-full relative overflow-hidden pt-10 pb-6">

            <!-- 1. REGISTRATION SCREEN (iOS SETUP ASSISTANT STYLE) -->
<div id="screen-register" class="absolute inset-0 z-40 bg-slate-950 p-6 flex flex-col justify-between overflow-y-auto hidden pt-14 pb-8">
    <div class="space-y-6">
        <!-- Header Avatar & Welcome -->
        <div class="text-center space-y-3">
            <div class="relative w-24 h-24 mx-auto">
                <div class="w-full h-full rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 p-0.5 shadow-xl shadow-sky-500/20">
                    <img id="reg-avatar" 
                         src="https://ui-avatars.com/api/?name=Warga+Ignatius&background=0284c7&color=fff" 
                         onerror="this.src='https://ui-avatars.com/api/?name=Warga&background=0369a1&color=fff'" 
                         class="w-full h-full object-cover rounded-full bg-slate-900" 
                         alt="PP Telegram">
                </div>
                <div class="absolute bottom-0 right-0 w-7 h-7 rounded-full bg-sky-500 border-2 border-slate-950 flex items-center justify-center text-white text-xs shadow-md">
                    <i class="fa-solid fa-check text-[10px]"></i>
                </div>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Atur Profil Warga</h2>
                <p class="text-xs text-slate-400 font-medium">Pendaftaran Identitas Digital Kota Ignatius</p>
            </div>
        </div>

        <!-- Form Group (iOS Inset Grouped Style) -->
        <form id="form-register" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
            <div class="glass-ios rounded-3xl p-4 space-y-4 border border-white/10 shadow-2xl">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block ml-1">Nama Lengkap</label>
                    <input type="text" id="reg-fullname" required 
                           class="w-full px-4 py-3 bg-slate-900/90 border border-white/10 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all placeholder:text-slate-600" 
                           placeholder="Nama Lengkap Warga">
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block ml-1">Jenis Kelamin</label>
                    <div class="relative">
                        <select id="reg-gender" class="w-full px-4 py-3 bg-slate-900/90 border border-white/10 rounded-xl text-xs font-semibold text-white focus:outline-none focus:border-sky-500 transition-all appearance-none cursor-pointer">
                            <option value="Laki-laki">Laki-laki</option>
                            <option value="Perempuan">Perempuan</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-xs text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <div class="space-y-1 pt-1">
                    <label class="text-[10px] font-bold text-amber-400 uppercase tracking-wider block ml-1">Buat PIN Lockscreen (4 Digit)</label>
                    <input type="password" maxlength="4" id="reg-passcode" required placeholder="••••" 
                           class="w-full px-4 py-3 bg-slate-950 border border-amber-500/40 rounded-xl text-center text-lg font-bold text-amber-400 tracking-[0.6em] focus:outline-none focus:border-amber-400 transition-all">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-bold text-xs rounded-2xl shadow-lg shadow-sky-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                <span>Daftar KTP & Masuk Kota</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>
    </div>
</div>

            <!-- 2. LOCKSCREEN iOS -->
            <div id="screen-lockscreen" class="absolute inset-0 z-30 bg-cover bg-center flex flex-col justify-between p-6 text-white cursor-grab active:cursor-grabbing transition-all duration-300">
                <div class="pt-10 text-center space-y-1">
                    <p id="ios-date-display" class="text-xs font-semibold text-slate-200 tracking-wide uppercase">Rabu, 30 September</p>
                    <h1 id="ios-clock-big" class="text-6xl font-bold tracking-tight text-white">12:00</h1>
                </div>

                <div class="glass-ios p-4 rounded-3xl space-y-2 border border-white/15">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-2xl bg-sky-500/20 flex items-center justify-center text-sky-400">
                            <i class="fa-solid fa-city text-base"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-white">Kota Ignatius</h4>
                            <p class="text-[10px] text-slate-300" id="lockscreen-citizen-name">Warga Terdaftar</p>
                        </div>
                    </div>
                </div>

                <div onclick="openPasscodeKeypad()" class="text-center pb-6">
                    <p class="text-[11px] font-medium text-slate-300 tracking-wider flex items-center justify-center gap-1 animate-bounce">
                        <i class="fa-solid fa-chevron-up text-[10px]"></i>
                        Usap Ke Atas Untuk Buka
                    </p>
                </div>
            </div>

            <!-- 3. PASSCODE KEYPAD -->
            <div id="screen-passcode" class="absolute inset-0 z-40 bg-slate-950/95 backdrop-blur-2xl p-6 flex flex-col justify-between items-center text-white hidden pt-12">
                <div class="pt-8 text-center space-y-3">
                    <i class="fa-solid fa-lock text-xl text-amber-400"></i>
                    <h3 class="text-sm font-semibold">Masukkan PIN Kunci</h3>
                    <div class="flex justify-center gap-3 py-2" id="passcode-dots">
                        <div class="w-3.5 h-3.5 rounded-full border-2 border-white/60"></div>
                        <div class="w-3.5 h-3.5 rounded-full border-2 border-white/60"></div>
                        <div class="w-3.5 h-3.5 rounded-full border-2 border-white/60"></div>
                        <div class="w-3.5 h-3.5 rounded-full border-2 border-white/60"></div>
                    </div>
                </div>

                <div class="w-full max-w-[260px] grid grid-cols-3 gap-4 mb-6">
                    <button onclick="pressKey('1')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">1</button>
                    <button onclick="pressKey('2')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">2</button>
                    <button onclick="pressKey('3')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">3</button>
                    <button onclick="pressKey('4')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">4</button>
                    <button onclick="pressKey('5')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">5</button>
                    <button onclick="pressKey('6')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">6</button>
                    <button onclick="pressKey('7')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">7</button>
                    <button onclick="pressKey('8')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">8</button>
                    <button onclick="pressKey('9')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">9</button>
                    <button onclick="cancelPasscode()" class="w-16 h-16 text-xs text-slate-400 mx-auto flex items-center justify-center">Batal</button>
                    <button onclick="pressKey('0')" class="keypad-btn w-16 h-16 rounded-full glass-card text-xl font-bold mx-auto flex items-center justify-center">0</button>
                    <button onclick="deleteKey()" class="w-16 h-16 text-slate-300 mx-auto flex items-center justify-center"><i class="fa-solid fa-delete-left"></i></button>
                </div>
            </div>

            <!-- 4. HOMESCREEN iOS -->
            <div id="screen-homescreen" class="absolute inset-0 z-20 bg-cover bg-center p-5 flex flex-col justify-between hidden pt-12" style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('assets/images/wallpaper.png');">
                <div class="space-y-4 pt-2">
                    <div class="glass-ios p-3.5 rounded-3xl space-y-2 border border-white/20">
                        <div class="flex items-center justify-between">
